<style>

.chip{display:block;padding:10px 14px;border:1px solid var(--ln);border-radius:10px;margin:6px 0;cursor:pointer;font-size:14px}.chip.sel{border-color:var(--ac2);background:var(--gl)}
.nav2{display:flex;justify-content:space-between;gap:10px}
pre{white-space:pre-wrap;font:inherit;margin:0}
.star{color:var(--ac2);font-weight:700}
.hide{display:none}
</style></head><body>

,0,2.0],["шынайы",0,0]]},{"t":"Қайсысы сізге жақынырақ:","a":"TF","o":[["мәмілеге келу",0,1.0],["пікірталас.",0,0]]},{"t":"Қайсысы сізге жақынырақ:","a":"JP","o":[["a) реттелген",2.0,0],["алаңсыз.",0,1.0]]},{"t":"Қайсысы сізге жақынырақ:","a":"SN","o":[["белгі",1.0,0],["бейне.",0,0]]},{"t":"Қайсысы сізге жақынырақ:","a":"JP","o":[["жылдам",0,1.0],["ырғақты, бірқалыпты.",0,0]]},{"t":"Қайсысы сізге жақынырақ:","a":"SN","o":[["қалыптасқан дәстүр",1.0,0],["енгізілген жаңалықтар.",0,0]]},{"t":"Қай сөз сізге жақынырақ:","a":"SN","o":[["таныс",1.0,0],["таныс емес.",0,1.0]]}],"mo":{"items":["Өз карьерамды нақты ғылыми немесе техникалық салада құрамын.","Адамдарды бақылау және қадағалап отыру, оларға барлық деңгейде ықпал ету.","Бәрін өз ойындағыдай жасауға мүмкіндігі болу және қандай да бір ұйымның ережелеріне бағынышты болмау.","Тұрақты еңбекақысы бар мен әлеуметтік тұрғыдан қорғалған тұрақты жұмыс орны болу.","Өзінің адамдармен қарым-қатынас жасай алу қабілетін адамдарға пайдалы болатындай қолдануға, адамдарға көмектесу.","Шешілмейтін мәселе деп есептелетін мәселелерді қолға алу.","Отбасы мен карьера бірін-бірі толықтырып, жетілдіріп тұратындай өмір сүру.","Менің туындыма немесе идеяма толықтай үйлесетін бір нәрсе жасау және жүзеге асыру.","Өз мамандығыма мүлде қатысы жоқ жоғары лауазымға ие болғаннан өз мамандығыммен жұмыс істеуде жалғастырған дұрыс.","Мекемеде ең бірінші басшы болу.","Тәртіпке немесе басқа да ұйымдастырушылық шектеулерге қатысы жоқ жұмыс орны болу.","Ұзақ уақыт бойы тұрақтылықты қамтамасыз ететін мекемеде жұмыс істеу.","Өз қабілеті мен артықшылықтарын әлемді жақсарта түсу үшін қолдану.","Басқалармен жарысқа түсу және жеңіске жету.","Өз өмір сүру салтымды сақтауға мүмкіндік беретін карьера құру.","Жаңа коммерциялық мекеме құру.","Өмірімнің соңына дейін таңдап алған мамандығым бойынша жұмыс істеу.","Жоғары басшылық қызметке отыру.","Жұмыс түрі мен орындалу уақытын, т.б. таңдағанда барынша еркіндік пен дербестік беретін жұмыс істеу.","Лауазымың өсуіне байланысты басқа жаққа көшуге қарағанда, бір жерге тұрақты тұрып жұмыс істеу.","Көзделген маңызды мақсатқа қызмет ету үшін өзіңнің қабілетің мен талантыңды қолдануға ммүмкіндік алу.","Менің карьерамның жалғыз ғана мақсаты - қандай салада туындағанына қарамастан, қиын мәселелерді табу және шешу.","Мен үнемі отбасым мен карьерама бірдей көңіл бөлуге тырысамын.","Мен үнемі өз ісімді бастауға және дамытуға мүмкіндік беретін идея іздеп жүремін.","Басшылық қызметке келісімімді беремін, егер ол менің кәсіби қызметімнің аясында болса ғана.","Мен жұмыс орнымда басқалардың жұмысын қадағалап және олардың жұмыстарын басқаруға мүмкіндік беретіндей жағдайға жеткім келеді.","Кәсіби қызметімде өзімнің еркіндігім мен дербестігімнің болуына көп көңіл бөлемін.","Мен үшін қызмет бойынша жоғарылап және жаңа жұмысқа тұруға басқа жаққа көшіп барғаннан гөрі қазіргі тұратын жерімде қалғаным маңыздырақ.","Үнемі басқаларға пайдалы бола алатын жүмыс іздеймін.","Жарыстар мен жүлделер - менің карьерамның ең маңызды және толқытатын тұстары.","Мен үшін егер карьера өзіме ұнайтын өмір сүруге мүмкіндік бере алса ғана маңызды болмақ.","Кәсіпкерлік қызмет менің карьерамның маңызды бөлігін құрайды.","Мамандығыма мүлде қатысы жоқ жұмысты істегенше, ондай мекемеден жұмыстан кеткенім дұрыс деп санаймын.","Беделді мекемеде жоғары деңгейлі басшы болған кезде ғана карьерамда жетістікке жеттім деп санаймын.","Маған қандай да бір мекеме немесе бизнес қысым көрсеткенін қаламаймын.","Ұзақ мерзімді келісім шартқа отыратын мекемеде жұмыс істеген дұрыс деп ойлаймын.","Менің өз карьерамды маңызды әрі пайдалы мақсатқа қол жеткізуге арнағым келеді.","Менің өзімді шешілуі қиын мәселелерді шешуге немесе жарыса жұмыс істеуге қатысқан кезде, өзімді жетістікке жеткен табысты адам сезінемін.","Карьерада жетістікке жетуге қарағанда белгілі бір өмір салтын таңдау және ұстану маңыздырақ.","Мен әрқашан өз бизнесімді құруды және дамытуды қаладым.","Мен іс-сапарға жібермейтін жұмысты қалаймын."],"g":[[0,8,16,24,32],[1,9,17,25,33],[2,10,18,26,34],[3,11,35],[19,27,40],[4,12,20,28,36],[5,13,21,29,37],[6,14,22,30,38],[7,15,23,31,39]],"n":["Сараптама","Менеджмент","Тәуелсіздік","Жұмыстың тұрақты болуы","Тұрғылықты жердің тұрақты болуы","Сервис","Жарысу (Бақталастық)","Өмірлік баланс","Кәсіпкерлік"],"d":["Жұмыста ең бастысы – өз ісінің шебері, нағыз сарапшы және профессионал болу. Өмірдің бұл қозғалтқышы нақты бір салада жекелеген талант пен талапқа байланысты. Осындай мансаптық бағдары бар адам профессионал, өз қызметінің шебері болуға талпынады. Осы істегі табыс оған теңдесіз бақыт сыйлайды. Бірақ егер жұмысы оған одан да жоғары кәсіби жетістіктерге жетуге мүмкіндік бермесе, оның жұмысқа деген қызығушылығы тез жоғалып кетеді. Қызметте жоғарылау немесе басқа адамдарды басқару адамның кәсіби біліктілігіне байланысты болған кезде ғана оған қызықты болады. Негізінде басқару үшін басқару оның қызығушылығын тудырмайды. Керісінше, адам оны кәсіби ортадағы дамудың бір бөлігі ретінде қарастырады. Сондықтан, көп жағдайда осы бағдардағы адамдар жетекші функцияларынан бас тартады. Мұндай адамға оның мәртебесі мен жоғары біліктілігімен реттелетін тану маңызды.","Адамдарды, жобаларды, бизнес-процесттерді, т.б. басқару, жетекшілік ету. Мұндай адамдар үшін персоналды басқарудағы жауапкершілік пен олардың жұмысының нәтижесі, компанияның ресурстары мен функцияларын дұрыс бөлу маңызды. Тәжірибе өскен сайын мұндай бағдарлау көп жағдайда күшті байқаа бастайды. Жетекші функциясының негізгі мансаптық мотиваторлары, лайықты еңбекақы, міндеттердің кең спектрі және компания жетістіктеріне жеке үлес қосу. Кәсібиліктің негізгі өлшемі саналатын басты фактор – басты шешімдерді қабылдау, билік, басқару және компания дамуының веторларын белгілеу. Бұл бизнес оның жеке кәсібі ме немесе басқа біреудің жобасы бола ма маңызды емес (мұндай адам өз қабілеттерін жалданбалы жұмыста жақсы көрсетеді), айтарлықтай шешімдерді қабылдап, даму бағыттарын белгілеу маңызды. Мұндай адамдар үшін кәсіби мақсаттарға қол жеткізу – демек компания қызметінің әртүрлі аспектілерін басқару.","Жұмыста бастысы – тәуелсіздік, еркіндік, қатаң шектеулердің болмауы. Мұндай адамдар жұмыста жұмыс беруші қойған шектеу, ережелер мен тыйымдардың болмауына ұмтылады. Оларға жан-жақта еңбек кестесімен белгіленген шектеу, тәртіптік ережелер, дресс-код, процедуралар және басқа қалыптасқан стандарттарды орындау қиынға соғады. Жеке қарқында және ережелермен жұмыс істеу маңызды. Егер жұмыс жеке өмірмен тым тығыз байланысты болса, қиындықтар туындайды. Егер «тәуелсіздік немесе жоғары лауазым» мәселесі болса, таңдау біріншісінің пайдасына жасалады. Мансапты табысты деп сипаттайтын негізгі мақсат – нәтижеге қол жеткізу кестесі мен әдістерінде тәуелсіздік алу. Жұмыстағы табыс еркінідкпен сипатталады. Ал жұмыста қызметкерге қойылған шектеу немесе бағыну аймағына байланысты жайлылықтың болмауы тіпті ең тартымды вакансияны қызықсыз етеді.","Жұмыста бастысы – сенімділік, тұрақтылық және ертеңгі күнге сеніммен қарау. Мұндай адамға «ертеңгі күнге» сенімді болу маңызды. Оған мықты демеу, тұрақтылық және болжау жасау мүмкіндігі қажет. Жұмыстағы басымдық –қысқарып қалу немесе жұмыстан шығып қалу ықтималдығының төмен болуы. Ол өзінің кәсіби қызметін мансаппен байланыстырады, ал мансаптың нұсқалары тұрақтылыққа қажеттілікке байланысты азаяды. Уақыт өте келе оған уақытпен тексерілген, нарықтағы тұрақты жағдайы бар, ұзақ еңбек келісімшарты пен әлеуметтік кепілдіктерді ұсынатын жұмыс берушілер жақын болады да, ал қауіпті, қысқа мерзімді жобадан немесе жас компаниядан қашқақтайды.","Жұмыста ең бастысы – көшіп-қону және іссапарлардың болмауы. Үй, ошақ қасына аумақтық байланып қалу – мүмкін болатын мансаптық өсу немесе басқа қалада жаңа жобаның іске асырылуынан маңызды. Маман басқа жерге баруға тартынады, басөа жерге көшуді мүлде қарастырмайды, ал ықтимал болатын іссапарлар тіпті жұмыс таңдаған кезде үлкен минус болып көрінеді.","Жұмыста ең бастысы – өз құндылықтары мен жұмыстағы идеалдарды іске асыру. Осы мансаптық бағытқа өзінің кәсіби қызметінде жеке принциптері мен иеалдарын іске асыруды қалайтын адамдар жатады. Басты маркерлер қатарында «адамдармен жұмыс», «қоғамды жақсарту», «әлемді бақыттырақ ету мүмкіндігі», «айналадағы адамдарға көмек беру». Адам үшін әлеуметтік пайдалы болу және өз жұмысынан байқалған нәтиже жеке материалдық пайдадан жоғары болады. Басты талпынысы – адамдарға көмек пен пайда тигізу. Олардың кәсіби өсуінің басты мақсаты – қоғамдық мақсат үшін өз ресурстары мен тәжірибесін пайдалану мүмкіндігіне қол жеткізу. Осылайша мотивация алған адамдар өздерінің идеалдары мен мақсаттарын қолдамайтын компаниямен байланыса алмайды.","Жұмыста бастысы – шешілмейтін түйінді шешу және мүмкін еместі мүмкін ету. Бұл адамдар кәсіби қызметте үнемі жарысып жүреді және әркез биік белестерді бағындыруға «ұран тастауға» дайын тұрады. Ұранды адамдарға да, жағдайларға да тастауға дайын. Олар үшін сәттілік шешілмейтін тапсырмаларды орындау және күрделі мәселелерді шешумен өлшенеді. Тіпті лотереяны ұтып алу да жеңіс ретінде қарастырылады.","Жұмыста бастысы – кәсіби және жеке өмір арасындағы балансты сақтау. Мұндай адамдар үшін кәсіби қызмет әдеткі тіршілік ағынына кедергі болмауы керек. Мансап адам қызығушылықтарын толықтырып отыру керек. Адамдарға теңгерімнің болғаны маңызды, олар жеке уақыт, тіршілік, еңбекті жұмыс үшін сарп етуге дайын емес. Тіршіліктің ыңғайлы стилін сақтап қала алу мансаптағы табыстылықтан арттығырақ. Кәсіби өсу жеке істерге кедергі келтермегенде, өмірдің ырғағына араласпаған кезде ғана қызықты болады.","Жұмыста ең бастысы – жаңа жобалар, тауарлар, қызметтерді құру, жаңа кәсіп бастау. Мұндай адамға өз кәсібін, өндірісін немесе сервисін ұйымдастыру қызықты болады. Оның міндеті жеке идеяны іске асыру, түбегейлі жаңа, тың, бірегей дүние құра алу. Табыстың шыңы – жеке бизнес құра алу. Адам сол кәсібіне жанын сала алады, кәсібі – нәсібіне айналады. Кәсібінде жан рахатын тапқан адам тәуекелдер немесе сәтсіздіктерге қарамастан мақсатына қарай ұмтылыста болады. Бұл ретте кәсіпкерлер қашанда шығармашылық адамдар бола бермейтінін атап өткен жөн."]},"in":{"items":["Мен жақсы жазамын және өз ойымды қағазға немесе компьютерге жазғанды ұнатамын","Кез-келген нәрсенің қалай жұмыс істейтінін зерттеген ұнайды.","Мен кез-келген нәрсені миымда ойша анық елестете аламын.","Мен түрлі дыбыстарды/тонды ажырата аламын","Қалай алдыма мақсат қоюды және оған жету жолын білемін","Спорт жайында жақсы білемін.","Жануарлар туралы жазылған кітаптарды ұнатамын.","Маған адамдармен танысқан ұнайды.","Мен оқиғаларды немесе әзілдерді айтқанды ұнатамын.","Арифметикалық есептерді ойша шығарамын","Маған сөзден гөрі карталар мен диаграммаларды оқыған ұнайды","Музыканы оңай есте сақтаймын","Мен өзімнің мықты және әлсіз тұстарымды жақсы білемін","Біраз уақыт бір жерде отыру керек олса, тыпыршып тыныш отыра алмаймын","Мен табиғатқа қатысты заттардың (аңдардың, жәндіктердің) топтамасын жинақтаймын.","Мен – шынайы көшбасшымын","Мен адамдардың аттарын, барған жерлерімді, күн немесе бөлшектерді жақсы есте сақтаймын.","Математиканы жақсы көремін.","Мен жиі түс көремін","Мен естіген мелодиямды бірден қайталай аламын","Мен өзіммен өзім оңаша қалғанда өзімді жақсы сезінемін және өзімнің жеке компаниямды жақсы көремін","Мен басқалардың қылықтарын, ым-ишараларын қайталай аламын","Жабайы аңдар мен құстарға жемсау орнатқан ұнайды","Достарымның қиындыққа тап болғанын ең бірінші болып мен білемін, олар менімен кеңесуге келеді","Сөздермен ойналатын ойындарды ұнатамын","Мен математикалық ойындарды жақсы көремін","Мен көркем сурет өнерін ұнатамын (скульптура, архитектура, живопись, сәндік қолөнер, хореография)","Музыкалық аспапта ойнай аламын","Өзімнің кім екенімді және не істеп жүргенімді ойласам, қуанып қаламын","Маған заттарды бөлшектеп, қайта құрастырған ұнайды","Құстарды сырттай бақылағанды ұнатамын","Танымайтын адамдармен тез достасып кетемін","Кітаптар мен журналдар оқығанды жақсы көремін","Шахмат, дойбы немесе басқа да стратегиялық ойындар ұнайды","Сурет сала аламын","Жиі іштей өлең айтып жүремін","Мені өзінің не қалайтынын білетін және жүйелі әрекет ететін адам ретінде сипаттауға болады","Заттарды алып, оларды араластырған ұнайды","Орманда жүргенді өзімді жақсы сезінемін","Маған клубтар, комитеттер мен ұйымдар ұнайды","Мен сауатты жазамын","Басқалардың пікірін тыңдай аламын","Мен киноны, образдарды және басқа да визуалды қойылымдарды ұнатамын","Маған шуыл, мысалы қозғалыс қатты әсер етеді","Басқалардың не ойлайтынын қызықтырмайды, мен тек өзім сенетін дүниелерді қорғаймын","Маған қозғалыста болған ұнайды: жүгіремін, секіремін, басқалармен күресемін","Табиғи құбылыстарды бақылаймын","Басқаларға бірдеңе үйреткенді ұнатамын","Мағынасыз рифмдерді, ақылға сыймайтын өлеңдерді, каламбурларды және т.б. жақсы көремін","Заттарды категориясы бойынша немесе иерархиялық тәртіппен жіктеген ұнайды","Лабиринт ойындарды, бас қатырғыштар мен кубик рубикті ұнатамын","Қандай да бір істі ритммен жасаған ұнайды","Мен үнемі өз қателіктерім мен жетістіктерімнен сабақ аламын","Қолмен жұмыс істеген ұнайды, мысалы киім тігу, бірдеңені жөндеу, қолөнер, т.б.","Фермаға, немесе үй жануарлары бар жерлерге барғанды ұнатамын","Менің жақсы достарым мен жақын таныстарым көп","Маған сөздердің мағынасын білген ұнайды","Маған қиындықтарды шешу үшін түрлі интеллектуалдық қабілеттерді қолданған ұнайды","Басымдағы үш өлшемді суреттермен манипуляция жасай аламын","Ойыма орала берген музыканы тыңдай аламын","Қоғамдық іс-шараларды ұйымдастырған ұнайды","Пікірімді, ойымды айтқан кезде қолмен, т.б. көп ымыра жасаймын","Маған флора мен фаунаны бейнелейтін пейзаждың суреттері ұнайды","Басқа адамның көзқарасын қабылдай аламын","Менің сөздік қорым жақсы","Мен абстрактылы (дерексіз) немесе тұжырымдық деңгейде ойлана аламын","Жиі сурет саламын немесе қолдан тастармен, т.б. түрлі заттармен әшекейлеймін","Музыка тыңдағанды ұнатамын","Өзімнің сезімімме қатысты өзіме адалмын","Мен ойланып отырғанда немесе жұмыс істеп жатқанда түрлі физикалық сезімдер туындайды","Зоопарктер мен қорықтарды үлкен қызығушылықпен аралаймын","Адамдар тобымен сөйлескен ұнайды","Маған сөйлеген (түсіндірген, айтқан) және/немесе жазған ұнайды","Мен себеп-салдарлық байланысын анық көремін","Маған қағаз бетінде (немесе компьютерде) графиктік жобаларды сызған ұнайды","Алуан түрлі музыка ойнаса да темпті ұстай аламын","Мен ешқашан көңілсіз жүрмеймін, жағымсыз ойлар мазаламайды.","Өзімді қимыл-қозғалысыммен көрсеткенді ұнатамын","Үй жануарларым бар немесе болғанын үнемі қалаймын","Басқалармен пікір алмасқан ұнайды"],"g":[[0,8,24,32,40,47,48,56,64,72],[1,9,16,17,25,33,49,57,65,73],[2,10,18,26,34,42,50,58,66,74],[5,13,21,29,37,45,53,61,69,77],[3,11,19,27,35,43,51,59,67,75],[6,14,22,30,38,46,54,62,70,78],[4,12,20,23,28,36,44,52,68,76],[7,15,31,39,41,55,60,63,71,79]],"n":["Лингвистикалық","Логико-математикалық","Визуалды кеңістіктік","Дене-кинестетикалық","Музыкалық","Натуралистік","Тұлғаішілік/ Экзистенциалдық","Тұлғааралық"],"d":["сөйлеудің фонетикалық (сөйлеу дыбыстары), синтаксистік (грамматика), семантикалық (мағынасы) және прагматикалық компоненттеріне (әр түрлі жағдайларда сөйлеуді қолдану) жауап беретін механизмдерді қоса алғанда, сөйлеуді қалыптастыру мүмкіндігі","іс-әрекеттер немесе объектілер арасындағы қатынастарды, олар іс жүзінде болмаған кезде пайдалану және бағалау мүмкіндігі – басқаша айтқанда, дерексіз ойлау","Көрнекі және кеңістіктік ақпаратты қабылдау, оны өзгерту және визуалды бейнелерді бастапқы итермелеушілерге жүгінбестен қалпына келтіру мүмкіндігі. Суреттерді үш өлшемде салу, сондай-ақ осы суреттерді ойша жылжыту және айналдыру мүмкіндігін қамтиды","қиындықты шешу немесе өнімді жасау кезінде дененің барлық бөліктерін іске қосу мүмкіндігі. Мұнда дөрекі және нәзік моторлы қозғалыстарды бақылау және нысандарды басқару қабілеті маңызды рөл атқарады.","дыбыстарға байланысты мағыналарды туғызу, беру және түсіну қабілеті. Бұған дыбыстың биіктігін, ырғағын және тембрін (сапалық сипаттамаларын) қабылдауға жауапты механизмдер кіреді","табиғатпен қарым-қатынас жасауға, өсімдіктердің, жануарлардың және адамдардың табиғи инстинктерін түсіну қабілетіне жауап береді","өз сезімдерін, ниеттері мен уәждерін тану мүмкіндігі","басқа адамдардың сезімдері, көзқарастары мен ниеттері арасындағы айырмашылықтарды айқындау"]},"ty":{"ESFP":"Экстравертированный Сенсорный Чувствующий Воспринимающий\n \nДевиз: \"Живем ведь только раз!\"\nДоминирующая функция – экстравертная сенсорность, связанная с фактами и восприятием деталей.\nВспомогательная функция – интровертная чувствительность – межличностно ориентированные отношения.\nДля них достаточно надежно только то, что имеет отношение к \"здесь и теперь\". Живут, в основном, ради настоящего момента. Больше начинают, чем заканчивают. Сосредоточенность на немедленных результатах делает их нетерпимыми к разного рода процедурам, шаблонам и прочим препятствиям. Стараются использовать каждую минуту для того, чтобы вступить в полезную беседу. Стремятся к гармонии человеческих взаимоотношений.","ISFP":"Интровертированный Сенсорный Чувствующий Воспринимающий\n\nДевиз: \"Все видит, ни во что не вмешивается\".\nДоминирующая функция – интровертная чувствительность – межличностно ориентированные решения и структура.\nВспомогательная функция – экстравертная сенсорность, связанная с фактами и практикой.\nНежные и заботливые, открытые и подвижные, задумчивые и сдержанные, практичные и приземленные.\nЭто люди, которым не хочется руководить и воздействовать на других, которые не стремятся переделать мир и даже до конца понять его, а принимают таким, каков он есть.","ESTP":"Экстравертированный Сенсорный Мыслительный Воспринимающий\n \nХарактеристика: \"Реалисты до мозга костей\".\nДоминирующая функция – экстравертная сенсорность, связанная с фактами и восприятием деталей.\nВспомогательная функция – интровертный рационализм.\nИх внимание направлено на людей и мир объектов. Сбор информации происходит при помощи пяти органов чувств. В дальнейшем информация оценивается и анализируется объективно, но при этом они остаются подвижными и доступными для новых альтернатив. Способны дать быстрый, точный, практически ценный, объективный и ясно выраженный ответ в любой ситуации.","ISTP":"Интровертированный Сенсорный Мыслительный Воспринимающий \n\nХарактеристика: \"Легкие на подъем\". \nПо отношению к окружающим придерживаются принципа: \"Не мешай мне\".\nДоминирующая функция – интровертный рационализм – объективные решения.\nВспомогательная функция – экстравертная сенсорность, связанная с фактами и восприятием деталей.\nСосредоточенные на себе, склонные к объективности в принятии решений, они более расположены выжидать, анализировать ситуацию, нежели сразу предлагать свое решение и бросаться в бой. Их взгляд на мир предельно конкретный, но в сочетании со свойственной им открытостью это может приводить к более непредсказуемым поступкам, чем этого можно было бы ожидать.","ESFJ":"Экстравертированный Сенсорный Чувствующий Решающий\n\nХарактеристика: \"Повелители мира\".\nДоминирующая функция – экстравертная чувствительность – межличностно ориентированные отношения.\nВспомогательная функция – интровертная сенсорность, связанная с фактами и практикой.\nПредрасположенность к решению обеспечивает их всем необходимым для того, чтобы было легко устанавливать контакты с кем бы то ни было. Их субъективная чувствительность привносит гармонию в любую ситуацию, одновременно пытаясь упорядочить ее, направить ход событий по определенному руслу; и делают они это мягко, но настойчиво.","ISFJ":"Интровертированный Сенсорный Чувствующий Решающий\n\nХарактеристика: \"Высокое чувство долга\".\nДоминирующая функция – интровертная сенсорность, связанная с фактами и практикой.\nВспомогательная функция – экстравертная чувствительность – межличностно ориентированные решения и структура.\nАккуратные, добродушные, приверженные порядку и в высшей степени исполнительные и заботливые, они черпают силы в самих себе и во всем том, что видят, слышат, чувствуют, осязают и пробуют. Силы эти направлены на служение окружающим, при этом вся деятельность четко рассчитана и распланирована. Видят свое предназначение в том, чтобы помогать другим и делать их счастливее.","ESTJ":"Экстравертированный Сенсорный Мыслительный Решающий \n\nХарактеристика: \"Хозяева жизни\".\nДоминирующая функция – экстравертный рационализм – объективные решения и структура.\nВспомогательная функция – интровертная сенсорность, связанная с фактами и практикой.\nВидят мир таким, \"каков он есть\", переводят свои восприятия на объективный язык. Испытывают необходимость в том, чтобы навязывать свои оценки окружающим, устанавливая твердый порядок действий, который опирается на определенную программу. Управлять порядком где-либо – самое естественное занятие для них.","ISTJ":"Интровертированный Сенсорный Мыслительный Решающий\n \nДевиз: \"Делать то, что должно быть сделано\".\nДоминирующая функция – интровертная сенсорность, связанная с фактами и практикой.\nВспомогательная функция – экстравертный рационализм – объективные решения и структура.\nИмеют чувство ответственности. Их поведение ориентировано на конечный результат. Объективная, конкретная, ближайшая информация у них немедленно передается \"внутрь\" и внимательно анализируется. Их склонность ко всему, что находится \"здесь и теперь\", не позволяет им ничего принимать на веру или допускать что-либо. Все, что они видят, есть для них объективная и осязаемая реальность, в которой они немедленно наводят определенный порядок.","ENFJ":"Экстравертированный Интуитивный Чувствующий Решающий\n\nХарактеристика: \"Сладкоречивый увещеватель\".\nДоминирующая функция – экстравертная чувствительность – межличностно ориентированные решения.\nВспомогательная функция – интровертная интуиция – вдохновение и возможности.\nИх внимание сосредоточено на тех, кто их окружает, и они прекрасно понимают, кто в чем нуждается. Их богатое воображение и вдохновляющая натура выражают себя весьма конкретно и организованно, что позволяет им осуществлять свои фантазии. Имеют способность к интуитивному постижению ситуации при внимательном и заботливом отношении к позиции всех участников.","INFJ":"Интровертированный Интуитивный Чувствующий Решающий\n\nХарактеристика: \"Вдохновляющие окружающих\".\nДоминирующая функция – интровертная интуиция – вдохновение и возможности.\nВспомогательная функция – экстравертная чувствительность –межличностно ориентированные отношения и структура.\nДобры и сострадательны, но очень упрямы.\nИх движущая сила – интуиция, направленная внутрь, – поставляет им неиссякаемый поток идей и возможностей. И чем большую роль играет в INFJ интроверсия, тем более текучей, податливой и открытой им кажется жизнь. Но внешний мир изменяет направление этого потока вдохновенной творческой активности: они чувствуют призвание служить людям и осуществляют это весьма организованно и упорядоченно.","ENFP":"Экстравертированный Интуитивный Чувствующий Воспринимающий\n\nДевиз: \"Да здравствует жизнь!\"\nДоминирующая функция – экстравертная интуиция – возможности и отвлеченные наблюдения.\nВспомогательная функция – интровертная чувствительность – межличностно ориентированные решения.\nСочетание предрасположенности к экстраверсии, интуиции, чувствительности и восприимчивости дает им уникальную способность к эффективному сотрудничеству, участию в разнообразных предприятиях и умение противостоять неожиданностям.\nВоспринимают жизнь в разнообразии ее возможностей и истолковывают эти возможности с точки зрения их влияния на людей. Все это сопровождается активным взаимодействием с окружающим миром, а их любознательная позиция позволяет им ориентироваться в постоянной смене ситуаций.","INFP":"Интровертированный Интуитивный Чувствующий Воспринимающий \nХарактеристика: \"Благородные служители обществу\".\nДоминирующая функция – интровертная чувствительность – межличностно ориентированные решения и структура.\nВспомогательная функция – экстравертная интуиция – возможности и отвлеченные наблюдения.\nСтремление к самопознанию, самоопределению и согласию с самим собой. Благодаря качествам интровертов, их размышления направлены на самих себя, свойства интуитивистов обеспечивают их чувством бесконечных возможностей, заключенных в человеке. Чувствительность заставляет задуматься о том, как использовать эти возможности к своей собственной пользе и на благо окружающих, а качества воспринимающего позволяют сохранять восприимчивость к постоянному потоку новой информации.","ENTJ":"Экстравертированный Интуитивный Мыслительный Решающий\n\nХарактеристика: \"Вожди по натуре\".\nДоминирующая функция – экстравертный рационализм – объективные решения и структура.\nВспомогательная функция – интровертная интуиция – вдохновение и возможности.\nИмеют потребность в контроле и необычные способности к лидерству. Они распахнуты настежь, навстречу бесчисленным возможностям и смыслам, которые переводятся на язык объективных мыслительных операций и приводят к упорядоченной и своевременной деятельности. Для них жизнь раскрывается в борьбе, в споре, в схлестывании с окружающими во имя познания.","INTJ":"Интровертированный Интуитивный Мыслительный Решающий\n\nДевиз: \"Все можно улучшить\".\nДоминирующая функция – интровертная интуиция – вдохновение и возможности.\nВспомогательная функция – экстравертный рационализм – объективные решения и структура.\nИх богатый внутренний мир хранит в себе безграничные возможности, которые реализуются в виде стремления все улучшить и усовершенствовать. Слова, планы, проекты, идеи, люди – все им хочется сделать лучше, чем есть в действительности. По их мнению, даже самое лучшее можно сделать еще более лучшим. Стремятся к законченности.","ENTP":"Экстравертированный Интуитивный Мыслительный Воспринимающий \n\nДевиз: \"Одно увлекательное дело за другим\".\nДоминирующая функция – экстравертная интуиция – возможности и отвлеченные наблюдения.\nВспомогательная функция – интровертный рационализм – объективные решения.\nИх изобретательность постоянно ищет применения в самых различных профессиональных и непрофессиональных сферах. Она берет начало в предрасположенности к интуиции, открывающей перед ними безграничные возможности, в сочетании с их объективной способностью к принятию решений, направленной на окружающий мир. Это приводит к тому, что все преобразуется в идеи и схемы. Их больше привлекают новые идеи, они находятся в непрерывном напряжении деятельности.","INTP":"Интровертированный Интуитивный Мыслительный Воспринимающий\n\nХарактеристика: \"Любовь к решению проблем\".\nДоминирующая функция – интровертный рационализм – объективные решения.\nВспомогательная функция – экстравертная интуиция – возможности и отвлеченные наблюдения.\nЗадумчивость побуждает их исследовать все, что поставляет им интуиция. Их стремление к объективности требует тщательного анализа всей информации, а их непредвзятость и подвижность обеспечивает восприимчивость к неожиданным и новым фактам, какими бы они ни были. Такая комбинация предрасположений приводит к постановке парадоксальной цели: они вечно пытаются собрать в единое целое постоянно увеличивающееся количество данных. Однако постоянный приток новых сообщений и фактов этому препятствует. И в результате все мысли, идеи и планы, как бы окончательно они ни были сформулированы, в последний момент неизбежно меняются, лишь только \"новые данные\" о внешних или внутренних влияниях становятся доступными для исследователя. Поэтому они находятся в постоянном напряжении."}};

function h53(s,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

if(miss!==null){document.querySelectorAll(".q").forEach(e=>e.classList.remove("miss"));const e=$("#q"+miss);e.classList.add("miss");e.scrollIntoView({block:"center"});return}
page++;test()}
function back(){if(page>0){page--;test()}else if(S.stage>0){S.stage--;page=pagesOf(S.stage)-1;test()}else{S.g=null;intro()}}
function extra(){const st=S.stage;if(st==0){S.stage=1;page=0;save();return test()}
const k=st==1?"mo":"in",items=k=="mo"?D.mo.items:D.in.items,pts=k=="mo"?6:4,X=k=="mo"?"moX":"inX";
const sc=Object.entries(S[k]).map(([i,v])=>[+i,v]).sort((a,b)=>b[1]-a[1]);const th=sc[Math.min(7,sc.length-1)][1];
const cand=sc.filter(x=>x[1]>=th).map(x=>x[0]);
app.innerHTML=`<div class="steps">${stages.map((_,i)=>`<i class="${i<st?"on":i==st?"cur":""}"></i>`).join("")}</div><h2>Қосымша ${pts} балл</h2><p class="mu">Жауаптарыңды тексеріп, ең жоғары балл алған тұжырымдардан өзіңе барынша лайықты ҮШЕУІН таңда. Әрқайсысына +${pts} балл қосылады.</p>
<div class="card" id="xl">${cand.map(i=>`<label class="chip ${S[X].includes(i)?"sel":""}"><input type="checkbox" ${S[X].includes(i)?"checked":""} onchange="pick('${X}',${i},this)"> ${i+1}. ${esc(items[i])}</label>`).join("")}</div>
<div class="err" id="er"></div><div class="nav2"><button class="btn o" onclick="page=pagesOf(S.stage)-1;test()">← Артқа</button><button class="btn" onclick="fin()">${st==2?"Нәтижені көру":"Келесі бөлім"} →</button></div>`;window.scrollTo(0,0)}
function pick(X,i,el){const a=S[X];if(el.checked){if(a.length>=3){el.checked=false;$("#er").textContent="Тек үш тұжырым таңдалады.";return}a.push(i)}else S[X]=a.filter(x=>x!==i);el.parentNode.classList.toggle("sel",el.checked);$("#er").textContent="";save()}
function fin(){const st=S.stage,X=st==1?"moX":"inX";if(S[X].length!==3){$("#er").textContent="Дәл үш тұжырым таңда.";return}
if(st==1){S.stage=2;page=0;save();test()}else{S.stage=3;S.done=true;save();results()}}
/* ---------- scoring ---------- */
function calc(){const T={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0},L={EI:"EI",SN:"SN",TF:"TF",JP:"JP"};
D.mb.forEach((q,i)=>{const o=q.o[S.mb[i]];if(!o)return;const w=x=>Array.isArray(x)?x[S.g]:x,l=L[q.a];T[l[0]]+=w(o[1]);T[l[1]]+=w(o[2])});
const ax=["EI","SN","TF","JP"].map(a=>{const x=T[a[0]],y=T[a[1]];return{a,x,y,l:x>y?a[0]:a[1],tie:x==y}});
const type=ax.map(z=>z.tie?z.a[1]:z.l).join("");
const mo=D.mo.g.map(g=>g.reduce((s,i)=>s+S.mo[i]+(S.moX.includes(i)?6:0),0)/g.length);
const it=D.in.g.map(g=>g.reduce((s,i)=>s+S.in[i]+(S.inX.includes(i)?4:0),0));
return{T,ax,type,mo,it}}
function med(a){const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function results(){const R=calc(),L={E:"Экстраверт",I:"Интроверт",S:"Сенсорик",N:"Интуит",T:"Ойлау",F:"Сезу",J:"Шешуші",P:"Қабылдаушы"};
const bars=(names,vals,mx)=>{const md=med(vals),top=Math.max(...vals);return names.map((n,i)=>`<div class="row"><span>${vals[i]>=md?'<span class="star">★ </span>':""}${esc(n)}</span><span class="mono">${vals[i].toFixed(1)}</span></div><div class="bar"><i style="width:${Math.round(vals[i]/top*100)}%"></i></div>`).join("")};
const mi=R.mo.indexOf(Math.max(...R.mo)),ii=R.it.indexOf(Math.max(...R.it));
const ordM=[...R.mo.keys()].sort((a,b)=>R.mo[b]-R.mo[a]),ordI=[...R.it.keys()].sort((a,b)=>R.it[b]-R.it[a]);
const nm=(a,v,f)=>a.map((n,i)=>`${n}: ${v[i].toFixed(f)}`).join("\n");
const msg=`ПСИХОТИП ТЕСТІНІҢ ТОЛЫҚ НӘТИЖЕСІ\nНөмір: +${phone}\nЖынысы: ${S.g?"Әйел":"Ер"}\n\n1) MyCode типі: ${R.type}\n${R.ax.map(z=>`${L[z.a[0]]} ${z.x} : ${z.y} ${L[z.a[1]]}`).join("\n")}\n\n2) Карьерадағы құндылықтар (орташа балл):\n${nm(D.mo.n,R.mo,1)}\nНегізгі: ${D.mo.n[mi]}\n\n3) Интеллект (балл):\n${nm(D.in.n,R.it,0)}\nНегізгі: ${D.in.n[ii]}\n\nЖАУАПТАР\nMyCode: ${D.mb.map((_,i)=>["а","б","в"][S.mb[i]]).join("")}\nМотивация: ${D.mo.items.map((_,i)=>S.mo[i]).join(",")} (+6: №${S.moX.map(i=>i+1).join(",")})\nИнтеллект: ${D.in.items.map((_,i)=>S.in[i]).join("")} (+4: №${S.inX.map(i=>i+1).join(",")})`;
app.innerHTML=`<span class="tag mono">Нәтиже дайын</span><h1>Сенің психотипің</h1>
<div class="card"><div class="mu">1 · MyCode</div><div class="big mono">${R.type}</div>
${R.ax.map(z=>{const t=z.x+z.y||1;return `<div class="row"><span>${L[z.a[0]]} <b>${z.x}</b></span><span><b>${z.y}</b> ${L[z.a[1]]}</span></div><div class="bar"><i style="width:${Math.round(z.x/t*100)}%"></i></div>`}).join("")}
<pre class="mu" style="margin-top:8px;font-size:14px">${esc(D.ty[R.type]||"")}</pre></div>
<div class="card"><div class="mu">2 · Карьерадағы құндылықтарың</div><h2>${esc(D.mo.n[mi])}</h2><p class="mu" style="font-size:14px">${esc(D.mo.d[mi])}</p>${bars(D.mo.n,R.mo)}
<p class="mu" style="font-size:13px">★ — медианадан жоғары көрсеткіштер. Келесі күшті бағыттар: ${ordM.slice(1,3).map(i=>esc(D.mo.n[i])).join(", ")}.</p></div>
<div class="card"><div class="mu">3 · Интеллект</div><h2>${esc(D.in.n[ii])}</h2><p class="mu" style="font-size:14px">${esc(D.in.d[ii])}</p>${bars(D.in.n,R.it)}
<p class="mu" style="font-size:13px">Келесі күшті түрлер: ${ordI.slice(1,3).map(i=>esc(D.in.n[i])).join(", ")}.</p></div>
<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${OWNER}?text=${encodeURIComponent(msg)}">Толық нәтижені WhatsApp-пен жіберу</a>
<button class="btn o" style="margin-left:8px" onclick="again()">Қайта өту</button>`;window.scrollTo(0,0)}
function again(){S=fresh();save();page=0;route()}
(function init(){let p=null;try{p=localStorage.getItem("pl_session")}catch(e){}
if(p&&p.length>=10){phone=p;S=load(p)||fresh();setWho();page=S.stage<3?0:0;if(S.stage<3&&S.g!==null){page=0}route()}else login()})();
</script></body></html>
